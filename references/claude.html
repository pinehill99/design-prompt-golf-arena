<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude — reference</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #FAF9F5; color: #29261B; font-family: Georgia, "Times New Roman", serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 80px 32px 120px; }
  .nav { display: flex; align-items: center; justify-content: space-between; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  .dot { width: 22px; height: 22px; border-radius: 6px; background: #D97757; }
  .nav a { color: #6B6657; text-decoration: none; margin-left: 24px; }
  .hero { margin-top: 110px; }
  .eyebrow { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; color: #D97757; margin-bottom: 28px; }
  h1 { font-size: 64px; line-height: 1.05; letter-spacing: -0.02em; font-weight: 400; }
  p.lead { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 19px; line-height: 1.6; color: #6B6657; margin-top: 28px; max-width: 560px; }
  .cta { display: flex; gap: 14px; margin-top: 40px; font-family: ui-sans-serif, system-ui, sans-serif; }
  .btn { border: none; border-radius: 999px; padding: 14px 26px; font-size: 15px; font-weight: 500; cursor: pointer; }
  .btn.primary { background: #D97757; color: #FAF9F5; }
  .btn.ghost { background: transparent; color: #29261B; border: 1px solid #E0DBCE; }
  .rule { height: 1px; background: #E8E4D8; margin: 90px 0 40px; }
  .meta { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; color: #8B8676; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="nav">
      <div class="brand"><span class="dot"></span> Claude</div>
      <nav><a href="#">Research</a><a href="#">Pricing</a><a href="#">Login</a></nav>
    </div>
    <div class="hero">
      <div class="eyebrow">Anthropic</div>
      <h1>AI you can actually think alongside.</h1>
      <p class="lead">A thoughtful, honest assistant for writing, analysis, and code — designed to be helpful without getting in your way.</p>
      <div class="cta">
        <button class="btn primary">Start chatting</button>
        <button class="btn ghost">Read the docs</button>
      </div>
    </div>
    <div class="rule"></div>
    <div class="meta">Trusted by teams who care about careful, well-reasoned work.</div>
  </div>
</body>
</html>
